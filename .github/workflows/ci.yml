name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build RSCG_Sql.slnx --configuration Release

      - name: Run tests
        run: dotnet test RSCG_Sql.Tests/RSCG_Sql.Tests.csproj --configuration Release --no-build

      - name: Calculate package version
        id: package-version
        shell: pwsh
        run: |
          $version = ./scripts/Get-PackageVersion.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack generator
        run: dotnet pack RSCG_Sql.Generator/RSCG_Sql.Generator.csproj --configuration Release --no-build --output artifacts/packages -p:Version=${{ steps.package-version.outputs.version }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/packages/*.nupkg
